        () => { S.sessions = S.sessions.filter(x => x.id !== id); S.assessments = S.assessments.filter(a => a.sessionId !== id); save(); render(); toast("Session removed"); }, "Remove"); break; }
    case "userEdit": if (!requireAdmin()) break; userEdit(id); break;
    case "userBulk": if (!requireAdmin()) break; userBulk(); break;
    case "coAdminAdd": if (!requireAdmin()) break; userEdit(null, "coadmin"); break;
    case "userDel": if (!requireAdmin()) break; if (isMainAdmin(user(id))) { toast("The main Administrator account can't be deleted"); break; } if (id === S.ui.authedUserId) { toast("You can't delete the account you are signed in with"); break; } confirmDo("Delete user?", "They will no longer appear in the sign-in list.", () => { S.users = S.users.filter(u => u.id !== id); if (S.ui.userId === id) S.ui.userId = S.users[0].id; save(); render(); toast("User deleted"); }); break;
    case "critEdit": if (!requireAdmin()) break; critEdit(id); break;
    case "critDel": if (!requireAdmin()) break; confirmDo("Delete criterion?", "Completed assessments keep it, because they store the criteria they were marked against.", () => { S.criteria = S.criteria.filter(c => c.id !== id); save(); render(); toast("Criterion deleted"); }); break;
    case "critToggle": { if (!requireAdmin()) break; const c = byId(S.criteria, id); c.active = !c.active; save(); render(); break; }
    case "critMove": { if (!requireAdmin()) break; const list = sortBy(S.criteria, c => c.order); const i = list.findIndex(c => c.id === id); const j = i + (+t.getAttribute("data-d")); if (j < 0 || j >= list.length) break; const a = list[i], b = list[j]; const o = a.order; a.order = b.order; b.order = o; save(); render(); break; }
    case "normalise": if (!requireAdmin()) break; normaliseWeights(); break;
    case "thAdd": { if (!requireAdmin()) break; S.thresholds.push({ id: uid("t"), min: 50, label: "New band", tone: "l3" }); save(); render(); break; }
    case "thDel": { if (!requireAdmin()) break; S.thresholds = S.thresholds.filter(x => x.id !== id); save(); render(); break; }
    case "typeToggle": { if (!requireAdmin()) break; const ty = byId(S.types, id); ty.active = !ty.active; save(); render(); toast(ty.name + (ty.active ? " activated" : " retired")); break; }
    case "rate": { if (!EDIT) break; const c = t.getAttribute("data-c"), v = +t.getAttribute("data-v");
      EDIT.ratings[c] = Object.assign({}, EDIT.ratings[c], { rating: v });
      const box = document.getElementById("crit_" + c);
      box.querySelectorAll(".scale button").forEach(b => b.setAttribute("aria-pressed", String(+b.getAttribute("data-v") === v)));
      box.classList.remove("unrated"); box.classList.add("rated");
      const lv = scaleLevel(modelFor(EDIT.snapshot ? EDIT : null).scale, v);
      document.getElementById("note_" + c).innerHTML = lv ? "<b>" + lv.value + " — " + esc(lv.label) + "</b> · " + esc(lv.description) : "";
      refreshScore(); break; }
    case "saveDraft": persistEdit("Draft"); render(); toast("Draft saved"); break;
    case "submitA": submitAssessment(); break;
    case "print": case "printA": window.print(); break;
    case "repPDF": reportPDF(t.getAttribute("data-kind"), t.getAttribute("data-id")); break;
    case "repXLS": { const d = reportRows(t.getAttribute("data-kind"), t.getAttribute("data-id")); xlsxOut([{ name: d.name || "Report", rows: d.rows }], safeName(d.name || "report") + ".xlsx"); break; }
    case "repCSV": { const d = reportRows(t.getAttribute("data-kind"), t.getAttribute("data-id")); deliver(safeName(d.name || "report") + ".csv", toCSV(d.rows), "text/csv;charset=utf-8"); break; }
    case "exportAssessments": deliver("assessments-" + today() + ".csv", toCSV(assessmentRows(visibleAssessments())), "text/csv;charset=utf-8"); break;
    case "exportJSON": if (!requireAdmin()) break; deliver("assessment-system-backup-" + today() + ".json", JSON.stringify(S, null, 2), "application/json"); break;
    case "importJSON": { if (!requireAdmin()) break; const inp = document.createElement("input"); inp.type = "file"; inp.accept = ".json,application/json";
      inp.onchange = () => { const f = inp.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { try { const d = JSON.parse(rd.result); if (!d.criteria) throw 0; S = d; save(); render(); toast("Data imported"); } catch (e) { toast("That file is not a valid backup"); } }; rd.readAsText(f); };
      inp.click(); break; }
    case "learnerPaste": if (!requireAdmin()) break; learnerPaste(); break;
    case "learnerImportCSV": { if (!requireAdmin()) break;
      const inp = document.createElement("input"); inp.type = "file";
      inp.accept = ".csv,.txt,text/csv,text/plain,application/csv,application/vnd.ms-excel";
      inp.style.cssText = "position:fixed;left:-9999px;opacity:0";
      document.body.appendChild(inp);
      inp.onchange = () => {
        const f = inp.files[0]; inp.remove(); if (!f) return;
        const rd = new FileReader();
        rd.onload = () => {
          const buf = rd.result; let text;
          try { text = new TextDecoder("utf-8", { fatal: true }).decode(buf); }
          catch (e) { try { text = new TextDecoder("windows-1256").decode(buf); } catch (e2) { text = new TextDecoder().decode(buf); } }
          importLearnersFromCSV(text);
        };
        rd.onerror = () => toast("Could not read that file");
        rd.readAsArrayBuffer(f);
      };
      inp.click(); break; }
    case "reset": if (!requireAdmin()) break; confirmDo("Clear all data?", (fbOn() ? "This clears the SHARED database for every teacher and admin, leaving only the admin login. Export a backup first." : "Everything currently stored in this browser is removed, leaving only the admin login."), resetAll, "Clear"); break;
    case "loginMode": LOGIN_MODE = t.getAttribute("data-mode"); LOGIN_ERROR = null; LOGIN_INFO = null; FL = { step: 1 }; OTP = null; renderLogin(); break;
    case "flowResend": flowResend(); break;
    case "loginTab": setLoginTab(t.getAttribute("data-tab")); break;
    case "resetFromLogin": if (fbOn()) { confirmDo("Reset this device?", "Clears the copy saved on this device only. The shared database is not touched - everything downloads again.", localReset, "Reset this device"); break; } confirmDo("Reset this browser's data?", "This clears every course, class, learner and assessment saved in this browser, leaving only the default admin login (admin / Admin17102017). Do this only if you're locked out and have nothing here worth keeping.", resetAll, "Reset and start over"); break;
    case "clearF": go("assessments", {}); break;
    case "fbConnect": { if (!requireAdmin()) break; const c = fbParse((document.getElementById("fb_cfg") || {}).value); if (!c) { toast("That doesn't look like a Firebase web config (it needs apiKey and projectId)"); break; }
      try { localStorage.setItem(FB_LS, JSON.stringify(c)); } catch (e) {} toast("Connecting..."); setTimeout(function () { location.reload(); }, 400); break; }
    case "fbCopyLink": { const c = fbConfig(); if (!c) break; const url = location.href.split("#")[0].split("?")[0] + "?fb=" + btoa(JSON.stringify(c));
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(function () { toast("Setup link copied"); }, function () { window.prompt("Copy this link", url); }); else window.prompt("Copy this link", url); break; }
    case "fbDisconnect": if (!requireAdmin()) break; confirmDo("Disconnect this device?", "This device goes back to the old shared file. Other devices stay connected.", function () { try { localStorage.removeItem(FB_LS); } catch (e) {} location.reload(); }, "Disconnect"); break;
    case "jbPullBtn": jbPullNow(); break;
    case "jbPushBtn": { if (!jbReady()) { toast("No shared bin is set up in this file"); break; }
      toast("Pushing…"); syncPayload().then(jbPush).then(function () { jbSetStatus({ lastSynced: new Date().toISOString(), lastError: null }); render(); toast("Pushed to shared storage"); })
        .catch(function (e) { jbSetStatus({ lastError: e.message }); toast("Could not push: " + e.message); }); break; }
    case "attToday": { ATT = null; go("attendance", Object.assign({}, S.ui.params, { date: today() })); break; }
    case "guideHide": S.ui.guideHidden = true; save(); render(); break;
    case "guideShow": S.ui.guideHidden = false; save(); render(); break;
    case "assessLearner": { const L = learner(id); if (!L || !ownsClass(L.classId)) { toast("You don't have access to that class"); break; }
      const sid = t.getAttribute("data-s"); ASSESS_FROM = { classId: L.classId, sessionId: sid }; EDIT = null;
      startNew({ classId: L.classId, learnerId: L.id, sessionId: sid });
      go("assessments", EDIT && EDIT.id ? { mode: "edit", id: EDIT.id } : { mode: "new" }); break; }
    case "assessJump": { if (!EDIT || !ASSESS_FROM) break; stashFeedback();
      const d = +t.getAttribute("data-d"), ls = sortBy(learnersOf(EDIT.classId), l => l.name.toLowerCase());
      const nx = ls[ls.findIndex(l => l.id === EDIT.learnerId) + d]; if (!nx) break;
      const sid = EDIT.sessionId, cid = EDIT.classId;
      if ((EDIT.status === "Draft" || EDIT.status === "In Progress") && scoreOf(EDIT).rated > 0) { persistEdit("Draft"); toast("Draft saved"); }
      EDIT = null; startNew({ classId: cid, learnerId: nx.id, sessionId: sid });
      if (EDIT && EDIT.id) { S.ui.params = { mode: "edit", id: EDIT.id }; } else { S.ui.params = { mode: "new" }; }
      render(); try { window.scrollTo(0, 0); } catch (e) {} break; }
    case "attTab": go("attendance", Object.assign({}, S.ui.params, { tab: t.getAttribute("data-tab") })); break;
    case "attToggle": { if (!ATT) break; if (ATT.present.has(id)) ATT.present.delete(id); else ATT.present.add(id); attRefreshRow(id); break; }
    case "attAll": { if (!ATT) break; learnersOf(ATT.classId).forEach(l => { ATT.present.add(l.id); attRefreshRow(l.id); }); break; }
    case "attNone": { if (!ATT) break; ATT.present.clear(); learnersOf(ATT.classId).forEach(l => attRefreshRow(l.id)); break; }
    case "attSave": attSaveRegister(); break;
    case "attOpen": { ATT = null; go("attendance", Object.assign({}, S.ui.params, { tab: "take", date: t.getAttribute("data-date") })); break; }
    case "attDel": { if (!requireAdmin()) break; const d = t.getAttribute("data-date"), cid = (S.ui.params || {}).classId || (visibleClasses()[0] || {}).id;
      confirmDo("Delete the register for " + fmtDate(d) + "?", "The attendance marks for that day are removed. Assessments are untouched.",
        () => { delete S.attendance[attKey(cid, d)]; ATT = null; save(); render(); toast("Register deleted"); }); break; }
    case "attImport": if (!requireAdmin()) break; attImportModal(); break;
    case "attCSV": { const cid = (S.ui.params || {}).classId || (visibleClasses()[0] || {}).id;
      deliver(safeName("attendance " + (klass(cid) || {}).name) + ".csv", toCSV(attRows(cid)), "text/csv;charset=utf-8"); break; }
    case "attXLS": { const cid = (S.ui.params || {}).classId || (visibleClasses()[0] || {}).id;
      xlsxOut([{ name: "Attendance", rows: attRows(cid) }], safeName("attendance " + (klass(cid) || {}).name) + ".xlsx"); break; }
    case "closeModal": case "modalbg": closeModal(); break;
    case "saveModal": if (MODAL && MODAL.onSave) MODAL.onSave(); break;
  }
});
document.addEventListener("change", function (ev) {
  const el = ev.target, act = el.getAttribute && el.getAttribute("data-act"), id = el.getAttribute && el.getAttribute("data-id");
  if (act === "navsel") { go(el.value, {}); return; }
  if (act === "acClass") { go("assessments", { mode: "class", classId: el.value }); return; }
  if (act === "acSession") { go("assessments", { mode: "class", classId: (S.ui.params || {}).classId, sessionId: el.value }); return; }
  if (act === "attClass") { ATT = null; go("attendance", Object.assign({}, S.ui.params, { classId: el.value })); return; }
  if (act === "attDate") { ATT = null; go("attendance", Object.assign({}, S.ui.params, { date: el.value })); return; }
  if (el.id && el.id.indexOf("e_") === 0 && EDIT) {
    stashFeedback();
    if (el.id === "e_class") { EDIT.classId = el.value; const ls = learnersOf(el.value); EDIT.learnerId = (ls[0] || {}).id || ""; EDIT.sessionId = pickSessionFor(el.value, EDIT.learnerId); EDIT.courseId = (klass(el.value) || {}).courseId || ""; EDIT.id = null; EDIT.ratings = {}; EDIT.snapshot = null; syncDate(); loadExisting(); render(); return; }
    if (el.id === "e_learner") { EDIT.learnerId = el.value; EDIT.sessionId = pickSessionFor(EDIT.classId, el.value); EDIT.id = null; EDIT.ratings = {}; EDIT.snapshot = null; syncDate(); loadExisting(); render(); return; }
    if (el.id === "e_session") { EDIT.sessionId = el.value; EDIT.id = null; EDIT.ratings = {}; EDIT.snapshot = null; syncDate(); loadExisting(); render(); return; }
    if (el.id === "e_date") { EDIT.date = el.value; return; }
    return;
  }
  if (act === "f") { const p = S.ui.params || {}; const f = Object.assign({}, p.filters); f[el.getAttribute("data-k")] = el.value; if (el.getAttribute("data-k") === "classId") { f.sessionId = ""; f.learnerId = ""; } go("assessments", { filters: f }); return; }
  if (act === "filterClass") { go("learners", Object.assign({}, S.ui.params, { classId: el.value })); return; }
  if (act === "filterTeacher") { go("classes", el.value ? { trainerId: el.value } : {}); return; }
  if (act === "repKind") { go("reports", { kind: el.value }); return; }
  if (act === "repId") { go("reports", { kind: (S.ui.params || {}).kind || "class", id: el.value }); return; }
  if (act === "critWeight") { const c = byId(S.criteria, id); c.weight = Math.max(0, +el.value || 0); save(); render(); return; }
  if (act === "scaleLabel" || act === "scaleDesc") { const lv = scaleLevel(S.scale, el.getAttribute("data-v")); if (lv) { lv[act === "scaleLabel" ? "label" : "description"] = el.value; save(); } return; }
  if (act === "thLabel") { const th = byId(S.thresholds, id); th.label = el.value; save(); render(); return; }
  if (act === "thMin") { const th = byId(S.thresholds, id); th.min = Math.max(0, Math.min(100, +el.value || 0)); save(); render(); return; }
  if (act === "setOrg") { S.org = el.value; save(); render(); return; }
  if (act === "setReassess") { S.settings.allowReassessment = el.checked; save(); return; }
  if (act === "setRequire") { S.settings.requireAllRatings = el.checked; save(); return; }
});
document.addEventListener("input", function (ev) {
  const el = ev.target, act = el.getAttribute && el.getAttribute("data-act");
  if (act === "comment" && EDIT) { const c = el.getAttribute("data-c"); EDIT.ratings[c] = Object.assign({}, EDIT.ratings[c], { comment: el.value }); return; }
  if (act === "qLearner") { clearTimeout(window.__q); const v = el.value; window.__q = setTimeout(() => { S.ui.params = Object.assign({}, S.ui.params, { q: v }); save(); render(); const q = document.getElementById("q_learner"); if (q) { q.focus(); q.setSelectionRange(v.length, v.length); } }, 260); return; }
});
document.addEventListener("keydown", function (ev) {
  if (ev.key === "Escape" && MODAL) closeModal();
  if ((ev.key === " " || ev.key === "Enter") && ev.target.classList && ev.target.classList.contains("att-item")) { ev.preventDefault(); ev.target.click(); }
});
(MQ.addEventListener ? MQ.addEventListener.bind(MQ, "change") : MQ.addListener.bind(MQ))(function () { if (isAuthed() && !MODAL) render(); });

/* ============ INIT ============ */
function applyTheme() {
  const t = (S.settings && S.settings.theme) || "auto";
  if (t === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
}
(async function boot() {
  /* a teacher / Co-Admin setup link carries the Firebase config: ?fb=... */
  try { const q = new URLSearchParams(location.search).get("fb"); if (q) { const c = JSON.parse(atob(q)); if (c && c.apiKey && c.projectId) localStorage.setItem(FB_LS, JSON.stringify(c)); history.replaceState(null, "", location.pathname + location.hash); } } catch (e) {}
  try { IDB_PRE = await Promise.race([IDBX.get("S"), new Promise(r => setTimeout(() => r(null), 1500))]); } catch (e) {}
  load();
  VIEWS.learnerDash = () => learnerDashboard((S.ui.params || {}).id, false);
  applyTheme();
  if (!readHash()) writeHash();
  render();
  syncStart();
  if (jbReady()) jbPullNow(true);
})();
window.addEventListener("focus", function () { if (jbReady() && !MODAL) jbPullNow(true); });
/* keep multiple open browsers/devices converging even if none of them
   ever loses/regains window focus (e.g. two windows side by side) */
setInterval(function () { if (jbReady() && !MODAL) jbPullNow(true); }, 20000);
</script>
