<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Classroom Performance Assessment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#eef1f4; --card:#ffffff; --sunk:#f6f8f9;
  --ink:#16222b; --ink-2:#3c4d59; --mute:#6b7f8c; --line:#d9e1e6; --line-2:#eaeff2;
  --accent:#0d5f60; --accent-ink:#ffffff; --accent-soft:#dfeceb; --accent-line:#a8cbc9;
  --gold:#a8720f; --gold-soft:#f7ecd8;
  --l5:#155e45; --l4:#2c7f63; --l3:#2f6f96; --l2:#a9701a; --l1:#a33a3a;
  --l5-bg:#dfeee7; --l4-bg:#e4f0ea; --l3-bg:#e1ecf3; --l2-bg:#f7ecd8; --l1-bg:#f6e2e2;
  --nav-bg:#0f1c23; --nav-line:#1f3039; --nav-ink:#b9ccd5; --nav-ink-2:#6f8895; --nav-active:#173039;
  --shadow:0 1px 2px rgba(18,35,44,.06), 0 8px 24px -16px rgba(18,35,44,.35);
  --r:10px;
}
:root:not([data-theme="light"]){ }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0b1216; --card:#111b21; --sunk:#0e171c;
    --ink:#e3edf1; --ink-2:#b4c6ce; --mute:#8099a5; --line:#22333b; --line-2:#1a282f;
    --accent:#4ab5ad; --accent-ink:#06211f; --accent-soft:#122e2f; --accent-line:#27544f;
    --gold:#d3a04a; --gold-soft:#2b2312;
    --l5:#5fc79b; --l4:#63bf9e; --l3:#6fb2d8; --l2:#d9a85c; --l1:#e08585;
    --l5-bg:#122e24; --l4-bg:#132a23; --l3-bg:#132632; --l2-bg:#2b2312; --l1-bg:#2e1a1a;
    --nav-bg:#080f13; --nav-line:#16242b; --nav-ink:#a9bfc9; --nav-ink-2:#63808d; --nav-active:#132630;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --paper:#0b1216; --card:#111b21; --sunk:#0e171c;
  --ink:#e3edf1; --ink-2:#b4c6ce; --mute:#8099a5; --line:#22333b; --line-2:#1a282f;
  --accent:#4ab5ad; --accent-ink:#06211f; --accent-soft:#122e2f; --accent-line:#27544f;
  --gold:#d3a04a; --gold-soft:#2b2312;
  --l5:#5fc79b; --l4:#63bf9e; --l3:#6fb2d8; --l2:#d9a85c; --l1:#e08585;
  --l5-bg:#122e24; --l4-bg:#132a23; --l3-bg:#132632; --l2-bg:#2b2312; --l1-bg:#2e1a1a;
  --nav-bg:#080f13; --nav-line:#16242b; --nav-ink:#a9bfc9; --nav-ink-2:#63808d; --nav-active:#132630;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -18px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Public Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  font-size:15px; line-height:1.5; font-feature-settings:"tnum" 1,"cv05" 1;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0; font-weight:600; letter-spacing:-.01em}
h1{font-size:1.5rem} h2{font-size:1.15rem} h3{font-size:1rem}
p{margin:0 0 .6em}
a{color:var(--accent)}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion: reduce){*{animation:none !important; transition:none !important}}

/* ---------- shell ---------- */
.app{display:grid; grid-template-columns:232px 1fr; min-height:100vh}
.nav{background:var(--nav-bg); color:var(--nav-ink); display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto}
.brand{padding:18px 18px 16px; border-bottom:1px solid var(--nav-line)}
.brand .mark{display:flex; align-items:center; gap:10px}
.brand .logo{width:36px; height:36px; border-radius:50%; flex:0 0 auto; background:#fff; display:block}
.brand .nm{font-size:13.5px; color:#fff; font-weight:600; letter-spacing:.01em; line-height:1.25}
.brand .sub{font-size:11.5px; color:var(--nav-ink-2); margin-top:8px}
.navlist{padding:10px 10px 24px; display:flex; flex-direction:column; gap:1px}
.navsec{font-size:10.5px; color:var(--nav-ink-2); padding:14px 10px 6px; letter-spacing:.06em}
.navlist a{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:none; border:0;
  color:var(--nav-ink); padding:8px 10px; border-radius:7px; cursor:pointer; font-size:13.5px;
  text-decoration:none;
}
.navlist a:hover{background:var(--nav-active); color:#fff}
.navlist a[aria-current="page"]{background:var(--nav-active); color:#fff; font-weight:600; box-shadow:inset 2px 0 0 var(--accent)}
.navlist .ic{width:16px; text-align:center; opacity:.85; font-size:13px}
.main{min-width:0; display:flex; flex-direction:column}
.topbar{
  display:flex; align-items:center; gap:14px; padding:12px 24px; background:var(--card);
  border-bottom:1px solid var(--line); position:sticky; top:0; z-index:30; flex-wrap:wrap;
}
.topbar .crumb{font-size:13px; color:var(--mute); flex:1; min-width:120px}
.topbar .crumb b{color:var(--ink); font-weight:600}
.who{display:flex; align-items:center; gap:8px}
.who select{max-width:210px}
.content{padding:22px 24px 64px; max-width:1180px; width:100%}
.mobile-nav{display:none}
.login-shell{min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--nav-bg); padding:24px}
.login-card{width:100%; max-width:380px; background:var(--card); border-radius:12px; border:1px solid var(--line); box-shadow:0 24px 60px -20px rgba(0,0,0,.5); padding:28px 26px}
.login-card .mark{display:flex; align-items:baseline; gap:9px; margin-bottom:4px}
.login-card .dial{font-family:"Newsreader",Georgia,serif; font-size:28px; color:var(--accent); line-height:1}
.login-card h1{font-size:1.15rem}
.login-card .sub{color:var(--mute); font-size:12.5px; margin:2px 0 20px}
.login-card .err{margin-bottom:14px}
.login-tabs{display:flex; gap:4px; background:var(--sunk); border:1px solid var(--line); border-radius:9px; padding:3px; margin:16px 0 18px}
.login-tabs button{flex:1; border:0; background:transparent; color:var(--mute); font-size:12.5px; font-weight:600; padding:8px 6px; border-radius:7px; cursor:pointer; letter-spacing:.01em}
.login-tabs button.on{background:var(--card); color:var(--ink); box-shadow:var(--shadow)}
.login-card .tabhint{color:var(--mute); font-size:12px; margin:-6px 0 16px}

/* ---------- primitives ---------- */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow)}
.card + .card{margin-top:16px}
.card-h{display:flex; align-items:center; gap:12px; padding:14px 16px; border-bottom:1px solid var(--line-2); flex-wrap:wrap}
.card-h h2,.card-h h3{flex:1; min-width:140px}
.card-b{padding:16px}
.card-b.tight{padding:0}
.hint{color:var(--mute); font-size:13px}
.pagehead{display:flex; align-items:flex-end; gap:16px; margin-bottom:18px; flex-wrap:wrap}
.pagehead .t{flex:1; min-width:220px}
.pagehead h1{font-family:"Newsreader",Georgia,serif; font-weight:500; font-size:1.75rem; letter-spacing:-.015em}
.pagehead p{margin:4px 0 0; color:var(--mute); font-size:13.5px; max-width:66ch}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.grid{display:grid; gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.spacer{flex:1}

.btn{
  display:inline-flex; align-items:center; gap:7px; border:1px solid var(--line); background:var(--card);
  color:var(--ink); padding:7px 13px; border-radius:7px; cursor:pointer; font-size:13.5px; font-weight:500;
}
.btn:hover{border-color:var(--accent-line); background:var(--sunk)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent; background:transparent; color:var(--ink-2)}
.btn.ghost:hover{background:var(--sunk); color:var(--ink)}
.btn.danger{color:var(--l1); border-color:var(--line)}
.btn.danger:hover{background:var(--l1-bg); border-color:var(--l1)}
.btn.sm{padding:4px 9px; font-size:12.5px}
.btn:disabled{opacity:.45; cursor:not-allowed}

.field{display:flex; flex-direction:column; gap:5px; margin-bottom:12px}
.field label{font-size:12.5px; color:var(--ink-2); font-weight:500}
input[type=text],input[type=number],input[type=date],input[type=email],select,textarea{
  background:var(--card); border:1px solid var(--line); border-radius:7px; padding:8px 10px; width:100%;
}
textarea{resize:vertical; min-height:70px; line-height:1.45}
input:focus,select:focus,textarea:focus{border-color:var(--accent); outline:none; box-shadow:0 0 0 3px var(--accent-soft)}
.inline-f{display:flex; gap:10px; flex-wrap:wrap}
.inline-f .field{flex:1; min-width:150px; margin-bottom:0}

table{width:100%; border-collapse:collapse; font-size:13.5px}
th{text-align:left; font-weight:600; color:var(--ink-2); font-size:12px; padding:10px 14px; border-bottom:1px solid var(--line); background:var(--sunk); white-space:nowrap}
td{padding:11px 14px; border-bottom:1px solid var(--line-2); vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--sunk)}
td.num,th.num{text-align:right; font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
tr.att-out td{opacity:.5}
tr.att-out td:first-child b{text-decoration:line-through; text-decoration-thickness:1px}

.tag{display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:20px; font-size:11.5px; font-weight:600; border:1px solid transparent; white-space:nowrap}
.tag.l5{background:var(--l5-bg); color:var(--l5)} .tag.l4{background:var(--l4-bg); color:var(--l4)}
.tag.l3{background:var(--l3-bg); color:var(--l3)} .tag.l2{background:var(--l2-bg); color:var(--l2)}
.tag.l1{background:var(--l1-bg); color:var(--l1)}
.tag.plain{background:var(--sunk); color:var(--mute); border-color:var(--line)}
.tag.draft{background:var(--gold-soft); color:var(--gold)}
.tag.ok{background:var(--accent-soft); color:var(--accent)}
.dot{width:7px; height:7px; border-radius:50%; background:currentColor; display:inline-block}

.stat{padding:14px 16px}
.stat .k{font-size:12px; color:var(--mute)}
.stat .v{font-family:"Newsreader",Georgia,serif; font-size:2rem; font-weight:500; line-height:1.1; margin-top:2px; font-variant-numeric:tabular-nums}
.stat .f{font-size:12px; color:var(--mute); margin-top:3px}
.meter{height:6px; border-radius:6px; background:var(--line-2); overflow:hidden; margin-top:9px}
.meter i{display:block; height:100%; background:var(--accent); border-radius:6px}
.empty{padding:36px 16px; text-align:center; color:var(--mute)}
.empty b{display:block; color:var(--ink); font-weight:600; margin-bottom:4px; font-size:14.5px}

/* ---------- assessment screen ---------- */
.crit{border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; background:var(--card)}
.crit + .crit{margin-top:12px}
.crit.unrated{border-left:3px solid var(--line)}
.crit.rated{border-left:3px solid var(--accent)}
.crit-h{display:flex; gap:12px; align-items:baseline; flex-wrap:wrap}
.crit-h h3{font-size:14.5px}
.crit-h .w{font-size:12px; color:var(--mute); font-variant-numeric:tabular-nums}
.crit .desc{color:var(--mute); font-size:13px; margin:3px 0 10px; max-width:70ch}
.scale{display:flex; gap:6px; flex-wrap:wrap}
.scale button{
  flex:0 0 auto; width:44px; height:38px; border-radius:7px; border:1px solid var(--line); background:var(--card);
  cursor:pointer; font-weight:600; font-size:15px; color:var(--ink-2);
}
.scale button:hover{border-color:var(--accent); color:var(--accent)}
.scale button[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.scale-note{margin-top:8px; font-size:13px; color:var(--ink-2); min-height:19px}
.scale-note b{color:var(--ink)}
.scorebar{
  position:sticky; bottom:0; background:var(--card); border-top:1px solid var(--line); margin:0 -24px -64px;
  padding:12px 24px; display:flex; gap:18px; align-items:center; flex-wrap:wrap; z-index:20;
  box-shadow:0 -6px 20px -18px rgba(0,0,0,.6);
}
.scorebar .big{font-family:"Newsreader",Georgia,serif; font-size:1.9rem; line-height:1; font-variant-numeric:tabular-nums}
.scorebar .lbl{font-size:12px; color:var(--mute)}
.bar-h{height:8px; border-radius:8px; background:var(--line-2); overflow:hidden; min-width:120px; flex:1; max-width:280px}
.bar-h i{display:block; height:100%; background:var(--accent)}

/* ---------- misc ---------- */
.modal-bg{position:fixed; inset:0; background:rgba(12,22,28,.45); display:flex; align-items:flex-start; justify-content:center; padding:5vh 16px; z-index:90; overflow-y:auto}
.modal{background:var(--card); border-radius:12px; width:100%; max-width:540px; border:1px solid var(--line); box-shadow:0 24px 60px -20px rgba(0,0,0,.5)}
.modal h2{padding:16px 18px; border-bottom:1px solid var(--line-2); font-size:1.05rem}
.modal .mb{padding:18px}
.modal .mf{padding:12px 18px; border-top:1px solid var(--line-2); display:flex; gap:8px; justify-content:flex-end}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:26px; background:var(--nav-bg); color:#fff; padding:10px 16px; border-radius:8px; font-size:13.5px; z-index:120; box-shadow:0 12px 30px -12px rgba(0,0,0,.6)}
.notice{padding:10px 14px; border-radius:8px; font-size:13px; border:1px solid var(--accent-line); background:var(--accent-soft); color:var(--ink)}
.notice.warn{border-color:var(--l2); background:var(--l2-bg); color:var(--l2)}
.notice.bad{border-color:var(--l1); background:var(--l1-bg); color:var(--l1)}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--mute)}
svg .gridline{stroke:var(--line-2)}
svg text{fill:var(--mute); font-size:11px; font-family:inherit}
svg text.val{fill:var(--ink); font-weight:600}
.repdoc{background:var(--card); padding:28px; border:1px solid var(--line); border-radius:var(--r)}
.repdoc h1{font-family:"Newsreader",Georgia,serif; font-weight:500}
.repdoc .rh{display:flex; justify-content:space-between; gap:20px; border-bottom:2px solid var(--ink); padding-bottom:12px; margin-bottom:18px; flex-wrap:wrap}
.kv{display:grid; grid-template-columns:auto 1fr; gap:4px 16px; font-size:13.5px}
.kv dt{color:var(--mute)} .kv dd{margin:0}
.fb{border-left:3px solid var(--accent-line); padding:2px 0 2px 12px; margin:8px 0; font-size:13.5px}
.fb b{display:block; font-size:12px; color:var(--mute); font-weight:600}

/* ---------- teacher mobile flow ---------- */
:root{--tabbar-h:60px; --warn-h:0px}
body.sync-warn{--warn-h:24px}
.tabbar{display:none}
.btn.lg{padding:12px 16px; font-size:15px; min-height:48px; justify-content:center; border-radius:10px; font-weight:600}
.guide .card-b{padding:16px}
.guide ol{margin:0; padding:0; list-style:none; display:grid; gap:14px}
.guide li{display:flex; gap:12px; align-items:flex-start; font-size:14px; line-height:1.45}
.guide .n{flex:0 0 28px; height:28px; border-radius:50%; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; font-weight:700; font-size:13px}
.guide li b{display:block; font-size:14.5px; margin-bottom:1px}
.guide .tip{margin-top:14px; font-size:13px; color:var(--ink-2); background:var(--accent-soft); border-radius:8px; padding:9px 12px}
.cls-card .cls-line{display:flex; justify-content:space-between; gap:10px; align-items:center; padding:7px 0; font-size:14px}
.cls-card .cls-line .k{color:var(--mute); min-width:0}
.cls-actions{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px}
.lrow{display:flex; align-items:center; gap:12px; padding:13px 16px; border-bottom:1px solid var(--line-2)}
.lrow:last-child{border-bottom:0}
.lr-main{flex:1; min-width:0}
.lr-main .nm{font-weight:600; overflow-wrap:anywhere}
.lr-end{display:flex; align-items:center; gap:8px; flex:0 0 auto}
.switcher{display:flex; align-items:center; gap:10px; margin-bottom:14px}
.switcher .sw-mid{flex:1; text-align:center; min-width:0; line-height:1.25}
.switcher .sw-mid b{display:block; overflow-wrap:anywhere}
.att-list{display:flex; flex-direction:column}
.att-item{display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line-2); cursor:pointer; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; min-height:64px}
.att-item:last-child{border-bottom:0}
.att-item .att-nm{flex:1; min-width:0; font-weight:600; overflow-wrap:anywhere}
.att-item .att-nm .hint{font-weight:400}
.att-pill{flex:0 0 auto; min-width:104px; text-align:center; padding:10px 12px; border-radius:24px; font-weight:700; font-size:14px; border:1.5px solid var(--line); background:var(--sunk); color:var(--mute)}
.att-item.att-on .att-pill{background:var(--l5-bg); color:var(--l5); border-color:var(--l5)}
.att-item.att-out .att-pill{background:var(--l1-bg); color:var(--l1); border-color:var(--l1)}
.att-sum{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:12px 16px; border-bottom:1px solid var(--line-2)}
.att-sum .tip{flex:1 1 100%; font-size:13px; color:var(--ink-2)}
.att-bar{position:sticky; bottom:0; z-index:20; background:var(--card); border-top:1px solid var(--line); padding:10px 16px; display:flex; gap:10px; align-items:center; box-shadow:0 -6px 20px -18px rgba(0,0,0,.6)}
.att-bar .cnt{flex:1; min-width:0; font-weight:600; font-size:14px}
.att-rep th:first-child,.att-rep td:first-child{position:sticky; left:0; z-index:1; background:var(--card)}
.att-rep th:first-child{background:var(--sunk)}
.syncdot{width:9px; height:9px; border-radius:50%; display:inline-block; background:var(--mute); margin-right:6px; flex:0 0 auto}
.syncdot.on{background:var(--l5); box-shadow:0 0 0 3px var(--l5-bg)}
.syncdot.warn{background:var(--l2); box-shadow:0 0 0 3px var(--l2-bg)}
pre.code{background:var(--sunk); border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-size:12px; overflow-x:auto; white-space:pre-wrap; margin:6px 0 12px}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .nav{display:none}
  .mobile-nav{display:block; padding:10px 16px; background:var(--nav-bg); position:sticky; top:0; z-index:40}
  .mobile-nav-row{display:flex; align-items:center; gap:10px}
  .mobile-nav .logo-sm{width:28px; height:28px; border-radius:50%; flex:0 0 auto; background:#fff; display:block}
  .mobile-nav select{background:var(--nav-active); color:#fff; border-color:var(--nav-line); flex:1; min-width:0}
  .topbar{padding:10px 16px; top:56px}
  .content{padding:16px 16px 60px}
  .scorebar{margin:0 -16px -60px; padding:12px 16px}
  .g4,.g3,.g2{grid-template-columns:1fr}
  .g4.keep2,.g3.keep2{grid-template-columns:repeat(2,minmax(0,1fr))}
  /* teacher phone layout */
  input[type=text],input[type=number],input[type=date],input[type=email],input[type=password],select,textarea{font-size:16px}
  .btn{min-height:40px}
  .btn.sm{min-height:34px}
  .pagehead h1{font-size:1.4rem}
  .pagehead .t{min-width:0; flex-basis:100%}
  .pagehead > .row{width:100%}
  .pagehead > .row .btn{flex:1; justify-content:center}
  .card-h select,.card-h input[type=date]{max-width:none !important; flex:1 1 100%}
  .has-tabbar{padding-bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px))}
  .tabbar{display:flex; position:fixed; left:0; right:0; bottom:0; z-index:60; height:calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px)); padding-bottom:env(safe-area-inset-bottom,0px); background:var(--card); border-top:1px solid var(--line); box-shadow:0 -8px 24px -18px rgba(0,0,0,.5)}
  .tabbar a{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color:var(--mute); text-decoration:none; font-size:11px; font-weight:600; min-width:0}
  .tabbar a .ic{font-size:19px; line-height:1}
  .tabbar a[aria-current="page"]{color:var(--accent); box-shadow:inset 0 2px 0 var(--accent)}
  .has-tabbar .toast{bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px) + 16px)}
  .scorebar{bottom:var(--warn-h)}
  .has-tabbar .scorebar{bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px) + var(--warn-h))}
  .att-bar{margin:0 -16px}
  .has-tabbar .att-bar{bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px) + var(--warn-h))}
  /* the offline warning becomes a slim, tap-through strip so it never blocks the tab bar or Save buttons */
  #syncBanner{pointer-events:none; height:var(--warn-h); line-height:var(--warn-h); padding:0 10px !important; font-size:11px !important; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .has-tabbar #syncBanner{bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px)) !important}
  .scale{flex-wrap:wrap; gap:8px}
  .scale button{flex:1 1 52px; width:auto; min-width:0; height:50px; font-size:17px}
  .crit{padding:14px 14px}
  .scorebar{gap:8px 14px; padding:10px 16px}
  .scorebar > div{min-width:0 !important}
  .scorebar .bar-h,.scorebar .spacer{display:none}
  .scorebar .big{font-size:1.5rem}
  .scorebar .btn{flex:1 1 auto; justify-content:center}
  .cls-actions .btn{padding:12px 8px}
  .tablewrap{-webkit-overflow-scrolling:touch}
}
@media print{
  .nav,.topbar,.mobile-nav,.no-print,.scorebar,.tabbar,.att-bar{display:none !important}
  .app{display:block} .content{padding:0; max-width:none}
  .repdoc{border:0; box-shadow:none; padding:0}
  body{background:#fff}
  .card{box-shadow:none; break-inside:avoid}
}
</style>

function sampleComment(r, crit) {
  const m = {
    5: "Outstanding contribution — set the standard for the group.",
    4: "Strong, consistent performance throughout the session.",
    3: "Solid work at the expected standard.",
    2: "Engaged in parts of the session but needs more consistency.",
    1: "Struggled to take part; follow-up support arranged."
  };
  return m[r] + " (" + crit + ")";
}
function snapshotOf(src) {
  return {
    criteria: src.criteria.filter(c => c.active).map(c => ({ id: c.id, name: c.name, description: c.description, weight: c.weight, order: c.order })),
    scale: JSON.parse(JSON.stringify(src.scale)),
    thresholds: JSON.parse(JSON.stringify(src.thresholds))
  };

/* ---------------- scoring engine ---------------- */
/* Criterion score = rating / maxRating * weight. An assessment that has been
   completed keeps the criteria, weights, scale and thresholds it was marked
   against, so later configuration changes never rewrite history. */
function modelFor(a) {
  if (a && a.snapshot) return a.snapshot;
  return { criteria: activeCriteria().map(c => ({ id: c.id, name: c.name, description: c.description, weight: +c.weight, order: c.order })), scale: S.scale, thresholds: S.thresholds };
}
function scoreOf(a) {
  const m = modelFor(a);
  const max = m.scale.max || 5;
  const rows = m.criteria.map(c => {
    const r = a.ratings && a.ratings[c.id] ? a.ratings[c.id].rating : null;
    const w = +c.weight || 0;
    return { id: c.id, name: c.name, weight: w, rating: r, score: r ? (r / max) * w : 0, maxScore: w };
  });
  const rated = rows.filter(r => r.rating);
  const weightTotal = sum(rows.map(r => r.weight)) || 100;
  const raw = sum(rows.map(r => r.score));
  const percent = weightTotal ? (raw / weightTotal) * 100 : 0;
  const ratedPercent = rated.length ? (sum(rated.map(r => r.score)) / sum(rated.map(r => r.weight))) * 100 : 0;
  return { rows, rated: rated.length, count: rows.length, percent, ratedPercent, raw, weightTotal, complete: rated.length === rows.length && rows.length > 0, level: levelFor(percent, m.thresholds) };
}
function levelFor(p, ths) {
  const list = sortBy(ths || S.thresholds, t => -t.min);
  return list.find(t => p >= t.min) || list[list.length - 1] || { label: "—", tone: "plain" };
}

/* Each screen has its own address (#/learners, #/reports?p=...), so the browser
   back button, bookmarks and shared links all behave the way a site should. */
function hashFor(view, params) {

function writeHash() {

function readHash() {

  S.ui.view = m[1];
  try { S.ui.params = m[2] ? JSON.parse(decodeURIComponent(m[2])) : {}; } catch (e) { S.ui.params = {}; }
  return true;

/* ---------------- WhatsApp OTP (password reset / phone registration) ----------------
   Browsers cannot message WhatsApp directly. Point WA_WEBHOOK at a small
   endpoint (Make, Zapier, n8n, a Cloudflare Worker, Twilio or the Meta
   WhatsApp Cloud API) that reads the JSON body {to, code, message} and sends
   `message` to WhatsApp number `to`. Until it is set, sending is refused.
   WA_TEST_MODE shows the code in a toast instead - for testing only. */
const WA_WEBHOOK = "";
const WA_TEST_MODE = false;
const WA_DEFAULT_CC = "20";
const REMEMBER_KEY = "cpas.remember.v1";
function getRemembered() { try { return JSON.parse(localStorage.getItem(REMEMBER_KEY) || "null"); } catch (e) { return null; } }
function normPhone(v) {
  let d = String(v || "").replace(/[^\d+]/g, "");
  if (d[0] === "+") d = d.slice(1); else if (d.slice(0, 2) === "00") d = d.slice(2); else if (d[0] === "0") d = WA_DEFAULT_CC + d.slice(1);
  d = d.replace(/\D/g, "");
  return d.length >= 8 && d.length <= 15 ? d : "";
}
const maskPhone = p => "+" + p.slice(0, 2) + " \u2022\u2022\u2022\u2022\u2022 " + p.slice(-3);
let OTP = null, FL = { step: 1 }, LOGIN_MODE = "signin", LOGIN_INFO = null;
async function sendOtp(phone) {
  if (OTP && Date.now() - OTP.sent < 60000) throw new Error("Please wait a minute before requesting another code.");
  if (!WA_WEBHOOK && !WA_TEST_MODE) throw new Error("WhatsApp sending isn't set up yet. Ask the administrator to configure WA_WEBHOOK.");
  const b = new Uint32Array(1); crypto.getRandomValues(b);
  const code = String(100000 + b[0] % 900000);
  if (WA_WEBHOOK) await fetch(WA_WEBHOOK, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain" }, body: JSON.stringify({ to: phone, code, message: "Your " + S.org + " verification code is " + code + ". It expires in 10 minutes. Do not share it." }) });
  else toast("Test code: " + code);
  OTP = { phone, code, exp: Date.now() + 600000, tries: 0, sent: Date.now() };
}
function checkOtp(c) {
  if (!OTP || Date.now() > OTP.exp) return "That code has expired. Request a new one.";
  if (++OTP.tries > 5) { OTP = null; return "Too many attempts. Request a new code."; }
  return String(c).trim() === OTP.code ? "" : "That code isn't right.";
}

  const rem = $("#lg_rem"), remember = rem ? rem.checked : true;
  S.ui.remember = remember;
  try {
    if (remember) { localStorage.setItem(REMEMBER_KEY, JSON.stringify({ tab: LOGIN_TAB, id: found.id, u: found.username || "" })); }
    else { localStorage.removeItem(REMEMBER_KEY); sessionStorage.setItem("cpas.sess", "1"); }
  } catch (e) {}
  S.ui.authedUserId = found.id; S.ui.userId = found.id; S.ui.view = "dashboard"; S.ui.params = {};

}
function logout() {
  S.ui.authedUserId = null; save();
  location.hash = "";
  render();
}


/* ---------------- small components ---------------- */
function pagehead(title, sub, actions) {
  return '<div class="pagehead"><div class="t"><h1>' + esc(title) + "</h1>" + (sub ? "<p>" + esc(sub) + "</p>" : "") + "</div>" + (actions ? '<div class="row no-print">' + actions + "</div>" : "") + "</div>";
}
function stat(k, v, f, meterPct) {
  return '<div class="card stat"><div class="k">' + esc(k) + '</div><div class="v">' + v + "</div>" + (f ? '<div class="f">' + f + "</div>" : "") +
    (meterPct != null ? '<div class="meter"><i style="width:' + Math.max(0, Math.min(100, meterPct)) + '%"></i></div>' : "") + "</div>";
}
function empty(title, msg, action) { return '<div class="empty"><b>' + esc(title) + "</b>" + esc(msg || "") + (action ? '<div style="margin-top:12px">' + action + "</div>" : "") + "</div>"; }
function selectOpts(list, val, labelFn, valFn) {
  return list.map(x => { const v = valFn ? valFn(x) : x.id; return '<option value="' + esc(v) + '"' + (String(v) === String(val) ? " selected" : "") + ">" + esc(labelFn(x)) + "</option>"; }).join("");
}

/* ---------------- charts (inline SVG) ---------------- */
function lineChart(points, opts) {
  opts = opts || {};
  const W = 640, H = 200, pad = { l: 34, r: 14, t: 14, b: 28 };
  if (!points.length) return '<div class="empty">No scored sessions yet.</div>';
  const iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
  const x = i => pad.l + (points.length === 1 ? iw / 2 : (i * iw) / (points.length - 1));
  const y = v => pad.t + ih - (Math.max(0, Math.min(100, v)) / 100) * ih;
  let grid = "", i;
  for (i = 0; i <= 4; i++) { const v = i * 25, yy = y(v); grid += '<line class="gridline" x1="' + pad.l + '" x2="' + (W - pad.r) + '" y1="' + yy + '" y2="' + yy + '" /><text x="' + (pad.l - 7) + '" y="' + (yy + 4) + '" text-anchor="end">' + v + "</text>"; }
  const path = points.map((p, i2) => (i2 ? "L" : "M") + x(i2) + " " + y(p.v)).join(" ");
  const area = path + " L" + x(points.length - 1) + " " + (pad.t + ih) + " L" + x(0) + " " + (pad.t + ih) + " Z";
  const dots = points.map((p, i2) => '<circle cx="' + x(i2) + '" cy="' + y(p.v) + '" r="4.5" fill="var(--card)" stroke="var(--accent)" stroke-width="2"><title>' + esc(p.label) + ": " + pct(p.v) + "</title></circle>" +
    '<text class="val" x="' + x(i2) + '" y="' + (y(p.v) - 11) + '" text-anchor="middle">' + Math.round(p.v) + "</text>").join("");
  const labels = points.map((p, i2) => '<text x="' + x(i2) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(p.short || p.label) + "</text>").join("");
  return '<svg viewBox="0 0 ' + W + " " + H + '" width="100%" height="' + H + '" role="img" aria-label="' + esc(opts.title || "Performance over time") + '">' +
    grid + '<path d="' + area + '" fill="var(--accent-soft)" opacity=".7"/><path d="' + path + '" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>' + dots + labels + "</svg>";
}
function barRows(rows) {
  if (!rows.length) return '<div class="empty">Nothing to chart yet.</div>';
  return '<div style="display:flex;flex-direction:column;gap:10px">' + rows.map(r => {
    const lv = levelFor(r.v);
    return '<div><div class="row" style="gap:8px;margin-bottom:4px"><span style="font-size:13px">' + esc(r.label) + '</span><span class="spacer"></span><span style="font-size:13px;font-variant-numeric:tabular-nums;font-weight:600">' + pct(r.v) + "</span></div>" +
      '<div class="meter" style="height:9px;margin:0"><i style="width:' + Math.max(1, Math.min(100, r.v)) + "%;background:var(--" + lv.tone + ')"></i></div></div>';
  }).join("") + "</div>";
}
function distributionBar(counts, total) {
  if (!total) return '<div class="empty">No completed assessments yet.</div>';
  const seg = counts.map(c => c.n ? '<div title="' + esc(c.label) + ": " + c.n + '" style="width:' + (c.n / total * 100) + "%;background:var(--" + c.tone + ');height:100%"></div>' : "").join("");
  return '<div style="display:flex;height:16px;border-radius:8px;overflow:hidden;border:1px solid var(--line)">' + seg + "</div>" +
    '<div class="legend" style="margin-top:10px">' + counts.map(c => '<span><span class="dot" style="color:var(--' + c.tone + ')"></span> ' + esc(c.label) + " · " + c.n + "</span>").join("") + "</div>";
}

      stat("Average score", scores.length ? pct(avg(scores)) : "—", scores.length ? levelFor(avg(scores)).label : "nothing scored yet", avg(scores)) +

    "</div>" +
    '<div class="grid g2" style="margin-top:16px">' +
      '<div class="card"><div class="card-h"><h2>Performance spread</h2><span class="hint">' + done.length + " completed</span></div><div class=\"card-b\">" + distributionBar(counts, done.length) +

        barRows(sessionAverageRows(classIds)) + "</div></div></div>" +

    "</div>" +
    '<div class="grid g2" style="margin-top:16px">' +
      '<div class="card"><div class="card-h"><h2>Highest performing</h2></div><div class="card-b tight"><div class="tablewrap"><table><tbody>' +
        (top.length ? top.map(x => '<tr><td>' + esc(x.L.name) + '</td><td class="num">' + pct(x.s) + "</td><td>" + levelTag(levelFor(x.s)) + '</td><td class="num"><button class="btn sm" data-act="learner" data-id="' + x.L.id + '">Open</button></td></tr>').join("") : '<tr><td colspan="4">' + empty("Nothing scored yet", "Complete an assessment to populate this list.") + "</td></tr>") +

function sessionAverageRows(classIds) {
  const rows = [];
  S.sessions.filter(s => classIds.includes(s.classId)).forEach(s => {
    const done = completedFor(a => a.sessionId === s.id);
    if (!done.length) return;
    const cl = klass(s.classId);
    rows.push({ label: "S" + s.number + " · " + s.title + " — " + (cl ? cl.name.split(" — ")[0] : ""), v: avg(done.map(a => scoreOf(a).percent)) });
  });
  return rows;
}


/* ============ TEACHER HOME (phone) ============ */
let ASSESS_FROM = null;
function curSession(classId) {
  const ss = sessionsOf(classId); if (!ss.length) return null;
  const t = today(); let pick = null;
  ss.forEach(x => { if (x.date && x.date <= t) pick = x; });
  return pick || ss[0];
}
function assessState(learnerId, sessionId) {
  const list = S.assessments.filter(a => a.learnerId === learnerId && a.sessionId === sessionId);
  const done = list.find(a => a.status === "Completed" || a.status === "Reviewed");
  if (done) return { k: "done", a: done };
  const draft = list.find(a => a.status === "Draft" || a.status === "In Progress");
  return draft ? { k: "draft", a: draft } : { k: "none", a: null };
}
function teacherGuide() {
  if (S.ui.guideHidden) return '<div style="margin:0 0 16px"><button class="btn sm ghost" data-act="guideShow">Show how-to guide</button></div>';
  return '<div class="card guide"><div class="card-h"><h2>How to use this on your phone</h2></div><div class="card-b"><ol>' +
    '<li><span class="n">1</span><div><b>Take attendance</b>Tap <b style="display:inline">Take attendance</b> on your class (or <b style="display:inline">Attendance</b> below). Tap <b style="display:inline">All present</b>, then tap each learner who is absent. Press <b style="display:inline">Save Data</b>.</div></li>' +
    '<li><span class="n">2</span><div><b>Assess a learner</b>Tap <b style="display:inline">Assess learners</b>, choose the session, then tap a learner. Tap a number for each criterion and add a comment if you wish.</div></li>' +
    '<li><span class="n">3</span><div><b>Submit and move on</b>Press <b style="display:inline">Submit assessment</b>. You return to the class list to pick the next learner. Use <b style="display:inline">Save Data</b> to finish later.</div></li>' +
    '</ol><div class="tip">Inside an assessment, use <b>‹ Prev</b> and <b>Next ›</b> at the top to move between learners.</div>' +
    '<div style="margin-top:12px"><button class="btn sm" data-act="guideHide">Got it, hide this</button></div></div></div>';
}
function teacherHome() {
  const u = me(), cls = visibleClasses();
  const hello = pagehead("Hello, " + (u.name || "teacher").split(" ")[0], fmtDate(today()) + " · " + cls.length + " class" + (cls.length === 1 ? "" : "es"), "");
  if (!cls.length) return hello + '<div class="card"><div class="card-b">' + empty("No classes assigned yet", "Ask an administrator to assign you to a class.") + "</div></div>";
  const cards = cls.map(c => {
    const ls = learnersOf(c.id), rec = attRec(c.id, today()), ses = curSession(c.id);
    const nPresent = rec ? (rec.presentIds || []).filter(id => ls.some(l => l.id === id)).length : 0;
    const regTag = rec ? '<span class="tag ok">✓ ' + nPresent + " of " + ls.length + " present</span>" : '<span class="tag draft">Not taken yet</span>';
    let done = 0, drafts = 0;
    if (ses) ls.forEach(l => { const st = assessState(l.id, ses.id); if (st.k === "done") done++; else if (st.k === "draft") drafts++; });

    return '<div class="card cls-card" style="margin-bottom:16px"><div class="card-b">' +
      "<h2>" + esc(c.name) + '</h2><div class="hint">' + esc((course(c.courseId) || {}).code || "") + " · " + ls.length + " learner" + (ls.length === 1 ? "" : "s") + "</div>" +
      '<div style="margin-top:8px"><div class="cls-line"><span class="k">Today\'s register</span>' + regTag + "</div>" +
      '<div class="cls-line"><span class="k">' + (ses ? esc("S" + ses.number + " · " + ses.title) : "No session yet") + "</span><span><b>" + done + "</b> of " + ls.length + " assessed" + (drafts ? " · " + drafts + " draft" + (drafts === 1 ? "" : "s") : "") + "</span></div>" +
      '<div class="meter" style="margin-top:2px"><i style="width:' + prog + '%"></i></div></div>' +
      '<div class="cls-actions">' +
        '<button class="btn primary lg" data-act="nav" data-view="attendance" data-params="' + esc(JSON.stringify({ tab: "take", classId: c.id, date: today() })) + '">◎ Take attendance</button>' +
        '<button class="btn lg" data-act="nav" data-view="assessments" data-params="' + esc(JSON.stringify({ mode: "class", classId: c.id })) + '">✓ Assess learners</button>' +
      "</div></div></div>";
  }).join("");
  const drafts = visibleAssessments().filter(a => a.status === "Draft" || a.status === "In Progress");
  const draftCard = drafts.length ? '<div class="card"><div class="card-h"><h2>Unfinished assessments</h2><span class="hint">' + drafts.length + "</span></div><div class=\"card-b tight\">" +
    sortBy(drafts, a => a.updatedAt || "").reverse().slice(0, 6).map(a => { const L = learner(a.learnerId), s1 = sessionOf(a.sessionId), sc = scoreOf(a);
      return '<div class="lrow"><div class="lr-main"><div class="nm">' + esc(L ? L.name : "—") + '</div><div class="hint">' + esc(s1 ? "S" + s1.number + " · " + s1.title : "") + " · " + sc.rated + "/" + sc.count + ' rated</div></div><div class="lr-end"><button class="btn sm primary" data-act="assessLearner" data-id="' + a.learnerId + '" data-s="' + a.sessionId + '">Continue</button></div></div>'; }).join("") +
    "</div></div>" : "";
  return hello + cards + draftCard + teacherGuide();
}

/* ============ ASSESS: pick class -> session -> learner ============ */
function assessPicker(p) {
  const cls = visibleClasses();
  const head = (sub, actions) => pagehead("Assess learners", sub, actions || "");
  if (!cls.length) return head("") + '<div class="card"><div class="card-b">' + empty("No classes yet", "You have no classes assigned.") + "</div></div>";
  let classId = p.classId;
  if (!cls.some(c => c.id === classId)) classId = cls.length === 1 ? cls[0].id : "";
  const allBtn = '<button class="btn ghost" data-act="nav" data-view="assessments" data-params="{}">All records</button>';
  if (!classId) {
    return head("Choose a class to assess.", allBtn) + cls.map(c => '<div class="card"><div class="lrow"><div class="lr-main"><div class="nm">' + esc(c.name) + '</div><div class="hint">' + learnersOf(c.id).length + ' learners</div></div><div class="lr-end"><button class="btn primary" data-act="nav" data-view="assessments" data-params="' + esc(JSON.stringify({ mode: "class", classId: c.id })) + '">Choose</button></div></div></div>').join("");
  }
  const c = klass(classId), ss = sessionsOf(classId);
  if (!ss.length) return head(c.name, allBtn) + '<div class="notice warn">This class has no sessions yet, so it can\'t be assessed. ' + (isAdmin() ? '<button class="btn sm" data-act="nav" data-view="sessions">Add a session</button>' : "Please ask an administrator to add a session for this class.") + "</div>";
  const cur = curSession(classId);
  const sid = ss.some(x => x.id === p.sessionId) ? p.sessionId : cur.id;
  const ls = sortBy(learnersOf(classId), l => l.name.toLowerCase());
  const states = ls.map(l => ({ l, st: assessState(l.id, sid) }));
  const done = states.filter(x => x.st.k === "done").length;
  const rows = states.map(x => {
    const l = x.l, st = x.st; let tag, btn;
    if (st.k === "done") { const sc = scoreOf(st.a); tag = '<span class="tag ok">✓ ' + pct(sc.percent) + "</span>"; btn = '<button class="btn sm" data-act="openA" data-id="' + st.a.id + '">View</button>'; }
    else if (st.k === "draft") { tag = '<span class="tag draft">Draft</span>'; btn = '<button class="btn sm primary" data-act="assessLearner" data-id="' + l.id + '" data-s="' + sid + '">Continue</button>'; }
    else { tag = '<span class="tag plain">To do</span>'; btn = '<button class="btn sm primary" data-act="assessLearner" data-id="' + l.id + '" data-s="' + sid + '">Assess</button>'; }
    return '<div class="lrow"><div class="lr-main"><div class="nm">' + esc(l.name) + "</div>" + (l.ref ? '<div class="hint">' + esc(l.ref) + "</div>" : "") + '</div><div class="lr-end">' + tag + btn + "</div></div>";
  }).join("");
  return head(c.name, allBtn) +
    '<div class="card"><div class="card-h">' +
      (cls.length > 1 ? '<select data-act="acClass" aria-label="Class">' + selectOpts(cls, classId, x => x.name) + "</select>" : "") +
      '<select data-act="acSession" aria-label="Session">' + selectOpts(ss, sid, x => "S" + x.number + " · " + x.title) + "</select></div>" +
      '<div class="card-b"><div class="row" style="justify-content:space-between"><b>' + done + " of " + ls.length + ' assessed</b><span class="hint">tap a learner to begin</span></div><div class="meter"><i style="width:' + (ls.length ? done / ls.length * 100 : 0) + '%"></i></div></div>' +
      '<div class="card-b tight" style="border-top:1px solid var(--line-2)">' + (ls.length ? rows : empty("No learners in this class", "")) + "</div></div>";
}
function learnerSwitcher() {
  if (!ASSESS_FROM || !EDIT) return "";
  const ls = sortBy(learnersOf(EDIT.classId), l => l.name.toLowerCase());
  const i = ls.findIndex(l => l.id === EDIT.learnerId);
  const L = learner(EDIT.learnerId), s1 = sessionOf(EDIT.sessionId), c = klass(EDIT.classId);
  return '<div class="switcher no-print"><button class="btn" data-act="assessJump" data-d="-1"' + (i <= 0 ? " disabled" : "") + '>‹ Prev</button>' +
    '<div class="sw-mid"><b>' + esc(L ? L.name : "—") + '</b><span class="hint">' + (i + 1) + " of " + ls.length + " · " + esc(s1 ? "S" + s1.number : "") + " · " + esc(c ? c.name : "") + '</span></div>' +
    '<button class="btn" data-act="assessJump" data-d="1"' + (i < 0 || i >= ls.length - 1 ? " disabled" : "") + ">Next ›</button></div>";
}

/* ============ LEARNER DASHBOARD ============ */
function learnerDashboard(learnerId, isSelf) {
  const L = learner(learnerId);
  if (!L) return empty("Learner not found", "Choose a learner from the Learners page.");
  const cl = klass(L.classId), co = cl ? course(cl.courseId) : null;
  const done = sortBy(S.assessments.filter(a => a.learnerId === L.id && (a.status === "Completed" || a.status === "Reviewed")), a => (sessionOf(a.sessionId) || {}).number || 0);
  const scores = done.map(a => scoreOf(a).percent);
  const sessAll = cl ? sessionsOf(cl.id) : [];
  const trend = scores.length > 1 ? scores[scores.length - 1] - scores[0] : 0;
  const points = done.map(a => { const s = sessionOf(a.sessionId); return { label: s ? s.title : a.date, short: s ? "S" + s.number : "", v: scoreOf(a).percent }; });
  const critRows = (activeCriteria()).map(c => {
    const vals = done.map(a => { const r = a.ratings[c.id]; return r ? (r.rating / (modelFor(a).scale.max || 5)) * 100 : null; }).filter(v => v != null);
    return { label: c.name, v: avg(vals), n: vals.length };
  }).filter(r => r.n).sort((a, b) => b.v - a.v);
  const weakest = critRows.slice(-2);
  const overall = avg(scores);

  return pagehead(isSelf ? "Your performance" : L.name, (co ? co.title : "") + (cl ? " · " + cl.name : ""),
    (can("report") ? '<button class="btn" data-act="nav" data-view="reports" data-params=\'{"kind":"learner","id":"' + L.id + '"}\'>Open report</button>' : "") +
    (can("assess") && !isSelf ? ' <button class="btn primary" data-act="newFor" data-id="' + L.id + '">Assess this learner</button>' : "")) +
    '<div class="grid g4 keep2">' +
      stat("Overall score", scores.length ? pct(overall) : "—", scores.length ? levelFor(overall).label : "not yet assessed", overall) +
      stat("Sessions assessed", done.length + " of " + sessAll.length, sessAll.length - done.length + " outstanding", sessAll.length ? done.length / sessAll.length * 100 : 0) +
      stat("Highest / lowest", scores.length ? pct(Math.max.apply(null, scores)) + " / " + pct(Math.min.apply(null, scores)) : "—", "across assessed sessions") +

/* ---- CSV import: First name, Last name, Grade, Class ---- */
function parseCSV(text) {
  text = String(text || "").replace(/^\ufeff/, "");
  /* auto-detect delimiter: Excel in many regions (incl. Egypt) saves CSV with ";" not "," */
  const firstLine = text.split(/\r?\n/).find(l => l.trim() !== "") || "";
  const cnt = ch => (firstLine.match(new RegExp(ch === "\t" ? "\t" : "\\" + ch, "g")) || []).length;
  let DELIM = ",";
  if (cnt(";") > cnt(",") && cnt(";") >= cnt("\t")) DELIM = ";";
  else if (cnt("\t") > cnt(",")) DELIM = "\t";
  const rows = []; let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQuotes = false; }
      else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === DELIM) { row.push(field); field = ""; }
      else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
      else if (c === "\r") { /* ignore, \n handles the break */ }
      else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(c => String(c || "").trim() !== ""));
}
function importLearnersFromCSV(text) {
  const rows = parseCSV(text);
  if (!rows.length) { toast("That file is empty"); return; }
  let start = 0;
  const head = (rows[0] || []).map(c => String(c || "").trim().toLowerCase());
  if (["first name", "firstname", "first"].includes(head[0] || "")) start = 1;
  let added = 0; const skipped = [];
  /* if the Learners page is filtered to one class, use it when the CSV has no Class value */
  const defCls = S.classes.find(c => c.id === ((S.ui.params || {}).classId || ""));
  rows.slice(start).forEach((r, idx) => {
    const rowNum = start + idx + 1;
    const first = String(r[0] || "").trim(), last = String(r[1] || "").trim(),
          grade = String(r[2] || "").trim(), className = String(r[3] || "").trim();
    if (!first && !last && !className) return;
    if (!first || !last) { skipped.push("Row " + rowNum + ": missing first or last name"); return; }
    const fullName = first + " " + last;
    if (!className && !defCls) { skipped.push("Row " + rowNum + " (" + fullName + "): no class given — pick a class in the filter first, or add a Class column"); return; }
    const cls = className ? S.classes.find(c => c.name.trim().toLowerCase() === className.toLowerCase()) : defCls;
    if (!cls) { skipped.push("Row " + rowNum + " (" + fullName + "): class \"" + className + "\" not found"); return; }
    const dup = S.learners.find(l => l.classId === cls.id && l.name.trim().toLowerCase() === fullName.toLowerCase());
    if (dup) { skipped.push("Row " + rowNum + " (" + fullName + "): already in " + cls.name); return; }
    S.learners.push({ id: uid("L"), name: fullName, ref: "", email: "", classId: cls.id, org: "", grade: grade });
    added++;
  });
  save(); render();
  const summary = added + " learner" + (added === 1 ? "" : "s") + " added" + (skipped.length ? ", " + skipped.length + " skipped" : "");
  if (skipped.length) {
    openModal("Import results", "<p>" + esc(summary) + "</p><div class=\"hint\" style=\"max-height:240px;overflow:auto;white-space:pre-wrap\">" + esc(skipped.join("\n")) + "</div>", () => closeModal(), "Close");
  } else toast(summary);
}

        }).join("") : '<tr><td colspan="7">' + empty("No sessions", "Add the first session for this class.") + "</td></tr>") +

function userBulk() {
  openModal("Bulk add users",
    sel("f_brole", "Role for all these users", [["trainer", "Teacher"], ["coadmin", "Co-Admin"], ["admin", "Administrator"], ["learner", "Learner"]].map(r => '<option value="' + r[0] + '">' + r[1] + "</option>").join("")) +
    '<div class="field"><label>Assigned classes (applies to trainers only)</label>' + S.classes.map(c => '<label style="display:flex;gap:8px;align-items:center;font-size:13.5px;padding:3px 0"><input type="checkbox" id="f_bcl_' + c.id + '" style="width:auto"> ' + esc(c.name) + "</label>").join("") + "</div>" +
    area("f_bulk", "One user per line", "", "Jane Doe, jane.doe\nJohn Smith, john.smith, , john@example.org") +
    '<p class="hint" style="margin-top:6px">Format per line: <b>Full name, username</b>, with an optional password as a 3rd value and email as a 4th. Leave the password blank (or the line off) to use the default <b>Teach2030</b> for everyone.</p>',
    () => {
      const role = mval("f_brole");
      const classIds = S.classes.filter(c => mchk("f_bcl_" + c.id)).map(c => c.id);
      const raw = mval("f_bulk");
      if (!raw) return toast("Paste at least one user first");
      const lines = raw.split("\n").map(l => l.trim()).filter(Boolean);
      const seen = {};
      let added = 0; const skipped = [];
      lines.forEach(line => {
        const parts = line.split(",").map(p => p.trim());
        const name = parts[0], username = parts[1], password = parts[2] || "Teach2030", email = parts[3] || "";
        if (!name || !username) { skipped.push(line + " — missing name or username"); return; }
        if ((role === "coadmin" || role === "admin") && !parts[2]) { skipped.push(line + " — admins need their own password as the 3rd value"); return; }
        if (seen[username.toLowerCase()] || usernameTaken(username)) { skipped.push(line + " — username already in use"); return; }
        seen[username.toLowerCase()] = true;
        S.users.push({ id: uid("u"), name, username, password, email, role: role === "coadmin" ? "admin" : role, coAdmin: role === "coadmin", classIds: role === "trainer" ? classIds : [], learnerId: "" });
        added++;
      });
      save(); closeModal(); render();
      toast(added + " user" + (added === 1 ? "" : "s") + " added" + (skipped.length ? ", " + skipped.length + " skipped" : ""));
      if (skipped.length) console.warn("Bulk add — skipped lines:\n" + skipped.join("\n"));
    }, "Add users");
}

/* ============ ASSESSMENTS: EDITOR ============ */
let EDIT = null;
function startNew(prefill) {
  const cls = visibleClasses();
  const classId = (prefill && prefill.classId) || (cls[0] || {}).id || "";
  const ls = classId ? learnersOf(classId) : [];
  const learnerId = (prefill && prefill.learnerId) || (ls[0] || {}).id || "";
  EDIT = {
    id: null, typeId: "classroom", classId,
    courseId: (klass(classId) || {}).courseId || "",
    sessionId: (prefill && prefill.sessionId) || pickSessionFor(classId, learnerId),
    learnerId,
    assessorId: me().id, date: today(), status: "Draft",
    ratings: {}, strengths: "", improvements: "", actions: "", feedback: "", snapshot: null,
    createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(), submittedAt: null
  };
  syncDate();
  loadExisting();
}
function syncDate() { const s = sessionOf(EDIT.sessionId); if (s && s.date) EDIT.date = s.date; }
function loadExisting() {
  /* pick up an unfinished draft for this learner and session, never a submitted one */
  const found = S.assessments.find(a => a.learnerId === EDIT.learnerId && a.sessionId === EDIT.sessionId && (a.status === "Draft" || a.status === "In Progress"));
  if (found) EDIT = JSON.parse(JSON.stringify(found));
}
function assessmentEditor(p) {
  if (p.mode === "edit" && (!EDIT || EDIT.id !== p.id)) { const a = byId(S.assessments, p.id); if (!a) return empty("Assessment not found", ""); EDIT = JSON.parse(JSON.stringify(a)); }
  if (p.mode === "new" && !EDIT) startNew(p.prefill);
  const cls = visibleClasses();
  const ss = sessionsOf(EDIT.classId), ls = learnersOf(EDIT.classId);
  const m = modelFor(EDIT.snapshot ? EDIT : null);
  const crits = (EDIT.status === "Completed" || EDIT.status === "Reviewed") && EDIT.snapshot ? EDIT.snapshot.criteria : activeCriteria();
  const scale = m.scale;
  const wTotal = sum(crits.map(c => +c.weight || 0));
  const dup = S.assessments.find(a => a.id !== EDIT.id && a.learnerId === EDIT.learnerId && a.sessionId === EDIT.sessionId && (a.status === "Completed" || a.status === "Reviewed"));
  const locked = (EDIT.status === "Completed" || EDIT.status === "Reviewed") && !can("edit");

  const head = '<div class="card"><div class="card-h"><h2>Who is being assessed</h2><span class="hint">' + esc(EDIT.status) + (EDIT.id ? " · saved " + fmtDT(EDIT.updatedAt) : " · not saved yet") + "</span></div><div class=\"card-b\">" +
    '<div class="inline-f">' +
      sel("e_class", "Class", selectOpts(cls, EDIT.classId, x => (course(x.courseId) || {}).code + " — " + x.name)) +
      sel("e_learner", "Learner", ls.length ? selectOpts(ls, EDIT.learnerId, x => x.name + " (" + x.ref + ")") : '<option value="">No learners</option>') +
      sel("e_session", "Session", ss.length ? selectOpts(ss, EDIT.sessionId, x => "S" + x.number + " · " + x.title) : '<option value="">No sessions in this class</option>') +
      fld("e_date", "Date", EDIT.date, "date") +
    "</div>" + (!ss.length ? '<div class="notice warn">This class has no sessions yet. <button class="btn sm" data-act="nav" data-view="sessions">Go add one</button> before an assessment can be submitted.</div>' : "") + "</div></div>";

  const compact = isMobile() && ASSESS_FROM;
  const warnings = [];
  if (Math.abs(wTotal - 100) > 0.01) warnings.push('<div class="notice warn">Active criteria weights total ' + n1(wTotal) + "%, not 100%. Scores are normalised against the total, but an administrator should fix the weights on the Assessment criteria page.</div>");
  if (dup && !S.settings.allowReassessment) warnings.push('<div class="notice bad">This learner already has a completed assessment for this session, so it cannot be submitted again — reassessment is switched off in Settings. <button class="btn sm" data-act="openA" data-id="' + dup.id + '">Open the existing record</button></div>');
  else if (dup) warnings.push('<div class="notice warn">A completed assessment already exists for this learner and session. Submitting will add a second record. <button class="btn sm" data-act="openA" data-id="' + dup.id + '">Open the existing record</button></div>');
  if (locked) warnings.push('<div class="notice">This assessment is submitted and read-only. An administrator can reopen it.</div>');

  const body = crits.map(c => {
    const r = EDIT.ratings[c.id] || {};
    const lvl = r.rating ? scaleLevel(scale, r.rating) : null;
    return '<div class="crit ' + (r.rating ? "rated" : "unrated") + '" id="crit_' + c.id + '">' +
      '<div class="crit-h"><h3>' + esc(c.name) + '</h3><span class="spacer"></span><span class="w">Weight ' + n1(c.weight) + "%</span></div>" +
      '<div class="desc">' + esc(c.description || "") + "</div>" +
      '<div class="scale" role="group" aria-label="Rating for ' + esc(c.name) + '">' +
        sortBy(scale.levels, l => l.value).map(l => '<button type="button" data-act="rate" data-c="' + c.id + '" data-v="' + l.value + '" aria-pressed="' + (+r.rating === +l.value) + '"' + (locked ? " disabled" : "") + ' title="' + esc(l.label + " — " + l.description) + '">' + l.value + "</button>").join("") +
      "</div>" +
      '<div class="scale-note" id="note_' + c.id + '">' + (lvl ? "<b>" + lvl.value + " — " + esc(lvl.label) + "</b> · " + esc(lvl.description) : '<span class="hint">Select a rating to see the descriptor.</span>') + "</div>" +
      '<div class="field" style="margin:10px 0 0"><label for="cm_' + c.id + '">Teacher comment</label><textarea id="cm_' + c.id + '" data-act="comment" data-c="' + c.id + '" style="min-height:52px" placeholder="What you observed"' + (locked ? " disabled" : "") + ">" + esc(r.comment || "") + "</textarea></div>" +
    "</div>";
  }).join("");

  const fb = '<div class="card"><div class="card-h"><h2>Feedback</h2></div><div class="card-b">' +
    area("e_strengths", "Strengths", EDIT.strengths, "What the learner did well") +
    area("e_improvements", "Areas for improvement", EDIT.improvements, "What needs to develop") +
    area("e_actions", "Recommended actions", EDIT.actions, "Development activities or follow-up") +
    area("e_feedback", "Overall teacher feedback (optional)", EDIT.feedback, "") + "</div></div>";

  return pagehead(EDIT.id ? "Edit assessment" : "New assessment",
    (isMobile() ? "Tap a number for each criterion." : "Rate each criterion, add what you saw, and the score builds as you go."),
    (ASSESS_FROM ? '<button class="btn ghost" data-act="nav" data-view="assessments" data-params="' + esc(JSON.stringify({ mode: "class", classId: ASSESS_FROM.classId, sessionId: ASSESS_FROM.sessionId })) + '">‹ Back to learners</button>' : '<button class="btn ghost" data-act="nav" data-view="assessments">Back to list</button>')) +
    learnerSwitcher() + warnings.join("") + (compact ? "" : head) +
    '<div class="card"><div class="card-h"><h2>Performance criteria</h2><span class="hint">Rating ÷ ' + (scale.max || 5) + " × weight</span></div><div class=\"card-b\">" + (crits.length ? body : empty("No active criteria", "An administrator needs to activate at least one criterion.")) + "</div></div>" +
    fb + scorebar(locked);
}
function scorebar(locked) {
  const sc = scoreOf(EDIT);
  const allowSubmit = !locked && sc.count > 0;
  return '<div class="scorebar no-print" id="scorebar">' +
    '<div><div class="lbl">Total score</div><div class="big" id="sb_pct">' + pct(sc.percent) + "</div></div>" +
    '<div style="min-width:170px"><div class="lbl">Overall performance</div><div id="sb_level" style="margin-top:4px">' + levelTag(sc.level) + "</div></div>" +
    '<div class="bar-h" title="Weighted score"><i id="sb_bar" style="width:' + Math.min(100, sc.percent) + '%"></i></div>' +
    '<div><div class="lbl">Criteria rated</div><div id="sb_rated" style="font-weight:600">' + sc.rated + " of " + sc.count + "</div></div>" +
    '<span class="spacer"></span>' +
    (locked ? '<button class="btn" data-act="printA">Print</button>' :
      '<button class="btn" data-act="saveDraft">Save Data</button><button class="btn primary" data-act="submitA"' + (allowSubmit ? "" : " disabled") + ">Submit assessment</button>") +
    "</div>";
}
function refreshScore() {
  const sc = scoreOf(EDIT);
  const p = $("#sb_pct"); if (!p) return;
  p.textContent = pct(sc.percent);
  $("#sb_level").innerHTML = levelTag(sc.level);
  $("#sb_bar").style.width = Math.min(100, sc.percent) + "%";
  $("#sb_rated").textContent = sc.rated + " of " + sc.count;
}
function stashFeedback() {
  if (!EDIT) return;
  ["strengths", "improvements", "actions", "feedback"].forEach(k => { const e = $("#e_" + k); if (e) EDIT[k] = e.value; });
}
function persistEdit(status) {
  stashFeedback();
  const sc = scoreOf(EDIT);
  EDIT.status = status;
  EDIT.updatedAt = new Date().toISOString();
  EDIT.assessorId = EDIT.assessorId || me().id;
  EDIT.courseId = (klass(EDIT.classId) || {}).courseId || EDIT.courseId;
  if (status === "Completed") {
    EDIT.submittedAt = new Date().toISOString();
    EDIT.assessorId = me().id;
    if (!EDIT.snapshot) EDIT.snapshot = snapshotOf({ criteria: S.criteria, scale: S.scale, thresholds: S.thresholds });
  }
  if (status === "Draft" && sc.rated > 0 && sc.rated < sc.count) EDIT.status = "In Progress";
  if (!EDIT.id) { EDIT.id = uid("a"); EDIT.createdAt = new Date().toISOString(); S.assessments.push(JSON.parse(JSON.stringify(EDIT))); }
  else { const i = S.assessments.findIndex(a => a.id === EDIT.id); if (i >= 0) S.assessments[i] = JSON.parse(JSON.stringify(EDIT)); else S.assessments.push(JSON.parse(JSON.stringify(EDIT))); }
  save();
}
function submitAssessment() {
  stashFeedback();
  const sc = scoreOf(EDIT);
  if (!EDIT.classId || !EDIT.learnerId) return toast("Choose a class and learner first");
  if (!EDIT.sessionId) return toast(sessionsOf(EDIT.classId).length ? "Choose a session first" : "This class has no sessions yet — add one before assessing");
  if (S.settings.requireAllRatings && !sc.complete) {
    const missing = sc.rows.filter(r => !r.rating).map(r => r.name);
    return openModal("Ratings missing", '<p>Every criterion needs a rating before this assessment can be submitted.</p><p class="hint">Still to rate: ' + esc(missing.join(", ")) + "</p>", () => closeModal(), "Back to the form");
  }
  const dup = S.assessments.find(a => a.id !== EDIT.id && a.learnerId === EDIT.learnerId && a.sessionId === EDIT.sessionId && (a.status === "Completed" || a.status === "Reviewed"));
  if (dup && !S.settings.allowReassessment) return toast("A completed assessment already exists for this learner and session");
  const L = learner(EDIT.learnerId), ses = sessionOf(EDIT.sessionId);
  openModal("Submit this assessment?",
    '<p>' + esc(L ? L.name : "") + " — " + esc(ses ? "Session " + ses.number + ": " + ses.title : "") + "</p>" +
    '<div class="row" style="gap:20px;margin:12px 0"><div><div class="hint">Total score</div><b style="font-size:1.4rem">' + pct(sc.percent) + "</b></div><div><div class=\"hint\">Overall performance</div>" + levelTag(sc.level) + "</div></div>" +
    '<p class="hint">Once submitted the record becomes read-only and keeps the criteria and weights used today. Later changes to the criteria will not alter it.</p>',
    () => { persistEdit("Completed"); const id = EDIT.id, f = ASSESS_FROM; EDIT = null; closeModal(); if (f) { go("assessments", { mode: "class", classId: f.classId, sessionId: f.sessionId }); toast("Submitted — pick the next learner"); } else { go("assessments", { mode: "view", id }); toast("Assessment submitted"); } },
    "Submit");
}

function normaliseWeights() {

  save(); render(); toast("Weights balanced to 100%");
}

VIEWS.analytics = function () {
  const cls = visibleClasses();
  const done = completedFor();
  const critRows = activeCriteria().map(c => {
    const vals = done.map(a => { const r = a.ratings[c.id]; return r ? (r.rating / (modelFor(a).scale.max || 5)) * 100 : null; }).filter(v => v != null);
    return { label: c.name, v: avg(vals), n: vals.length };
  }).filter(r => r.n).sort((a, b) => b.v - a.v);
  const classRows = cls.map(c => ({ label: c.name, v: avg(completedFor(a => a.classId === c.id).map(a => scoreOf(a).percent)) })).filter(r => r.v);
  const counts = S.thresholds.map(t => ({ label: t.label, tone: t.tone, n: done.filter(a => levelFor(scoreOf(a).percent).label === t.label).length }));
  const movers = visibleLearners().map(L => {
    const hs = sortBy(completedFor(a => a.learnerId === L.id), a => (sessionOf(a.sessionId) || {}).number || 0).map(a => scoreOf(a).percent);
    return { L, delta: hs.length > 1 ? hs[hs.length - 1] - hs[0] : null, n: hs.length, last: hs[hs.length - 1] };
  }).filter(x => x.delta != null).sort((a, b) => b.delta - a.delta);

  return pagehead("Analytics", "Where the cohort is strong, where it is not, and who is moving.") +
    '<div class="grid g2">' +
      '<div class="card"><div class="card-h"><h2>Criterion performance</h2></div><div class="card-b">' + barRows(critRows) +
        (critRows.length ? '<div class="hint" style="margin-top:14px">Strongest: ' + esc(critRows[0].label) + " · weakest: " + esc(critRows[critRows.length - 1].label) + "</div>" : "") + "</div></div>" +
      '<div class="card"><div class="card-h"><h2>Class comparison</h2></div><div class="card-b">' + barRows(classRows) +
        '<div style="margin-top:18px"><h3 style="font-size:13px;margin-bottom:10px">Performance spread</h3>' + distributionBar(counts, done.length) + "</div></div></div>" +
    "</div>" +
    '<div class="card" style="margin-top:16px"><div class="card-h"><h2>Cohort trend by session</h2></div><div class="card-b">' +
      cls.map(c => {
        const pts = sessionsOf(c.id).map(s => { const d = completedFor(a => a.sessionId === s.id); return d.length ? { label: s.title, short: "S" + s.number, v: avg(d.map(a => scoreOf(a).percent)) } : null; }).filter(Boolean);

async function deliver(filename, data, mime) {
  try {
    const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
    if (dl) { await dl.save({ filename, data }); toast("Saved " + filename); return; }
  } catch (e) { if (e && e.code === "declined") return; }
  try {
    const blob = data instanceof Blob ? data : new Blob([data], { type: mime || "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast("Downloaded " + filename);
  } catch (e) { toast("This view cannot save files"); }
}
const csvCell = v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
const toCSV = rows => "\ufeff" + rows.map(r => r.map(csvCell).join(",")).join("\r\n");
function xlsxOut(sheets, filename) {

}
function assessmentRows(list) {

function attRec(classId, date) { return (S.attendance || {})[attKey(classId, date)] || null; }
function attDatesFor(classId) {
  return Object.keys(S.attendance || {}).filter(k => k.split("|")[0] === classId).map(k => k.split("|")[1]).sort();
}
function attAllDates() {
  const set = {}; Object.keys(S.attendance || {}).forEach(k => { set[k.split("|")[1]] = 1; });
  return Object.keys(set).sort();
}
/* attendance for one learner across every register taken for their class */
function attLearner(learnerId) {
  const L = learner(learnerId); if (!L) return { present: 0, total: 0, pct: null };
  const dates = attDatesFor(L.classId);
  let present = 0;
  dates.forEach(d => { const r = attRec(L.classId, d); if (r && (r.presentIds || []).includes(learnerId)) present++; });
  return { present: present, total: dates.length, pct: dates.length ? (present / dates.length) * 100 : null };
}
function attClass(classId) {
  const ls = learnersOf(classId), dates = attDatesFor(classId);
  let present = 0, expected = ls.length * dates.length;
  dates.forEach(d => { const r = attRec(classId, d); if (r) present += (r.presentIds || []).filter(id => ls.some(l => l.id === id)).length; });
  return { registers: dates.length, present: present, expected: expected, pct: expected ? (present / expected) * 100 : null, dates: dates };
}
const attTone = p => p == null ? "plain" : p >= 90 ? "l5" : p >= 80 ? "l4" : p >= 70 ? "l3" : p >= 60 ? "l2" : "l1";
function attTag(p) { return '<span class="tag ' + attTone(p) + '"><span class="dot"></span>' + (p == null ? "—" : pct(p)) + "</span>"; }

/* working copy of the register being marked, mirroring how EDIT works for assessments */
let ATT = null;
function attLoad(classId, date) {
  const r = attRec(classId, date);
  ATT = { classId: classId, date: date, present: new Set(r ? (r.presentIds || []) : []), existing: !!r, rec: r };
}
function attEnsure(classId, date) {
  if (!ATT || ATT.classId !== classId || ATT.date !== date) attLoad(classId, date);
  return ATT;
}

function attLoadScript(src) {
  return new Promise((res, rej) => {
    if (document.querySelector('script[src="' + src + '"]')) return res();
    const s = document.createElement("script"); s.src = src; s.onload = res;
    s.onerror = () => rej(new Error("could not reach " + src)); document.head.appendChild(s);
  });
}
async function attImportRun(cfg, courseCode) {
  await attLoadScript("https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js");
  await attLoadScript("https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js");
  if (!window.firebase) throw new Error("Firebase did not load");
  let app; try { app = firebase.app("sr-import"); } catch (e) { app = firebase.initializeApp(cfg, "sr-import"); }
  const db = app.firestore();
  const snap = await db.collection("attendance-app").get();
  const docs = {};
  snap.forEach(d => { try { docs[d.id] = JSON.parse(d.data().value); } catch (e) { /* skip unreadable doc */ } });

  /* the course everything hangs from */
  let co = S.courses.find(x => (x.code || "").toUpperCase() === courseCode.toUpperCase());
  if (!co) { co = { id: uid("co"), code: courseCode, title: "School Register", owner: "", summary: "Imported from the School Register attendance app" }; S.courses.push(co); }

  const trainerId = name => {
    const n = String(name || "").trim(); if (!n) return "";
    let u = S.users.find(x => x.name.toLowerCase() === n.toLowerCase());
    if (!u) {
      let un = slugUsername(n), i = 1; while (usernameTaken(un)) un = slugUsername(n) + ++i;
      u = { id: uid("u"), name: n, email: "", role: "trainer", classIds: [], username: un, password: "Teach2030" };
      S.users.push(u);
    }
    return u.id;
  };

  let nClasses = 0, nLearners = 0, nRegisters = 0;
  const structure = docs.structure || { grades: [] };
  (structure.grades || []).forEach(g => {
    (g.classes || []).forEach(k => {
      let c = byId(S.classes, k.id);
      const tId = trainerId(k.teacher);
      if (!c) {
        c = { id: k.id, courseId: co.id, name: g.name + " · " + k.name, trainerId: tId, venue: "", start: today() };
        S.classes.push(c); nClasses++;
      } else if (tId && !c.trainerId) c.trainerId = tId;
      if (tId) { const u = user(tId); if (u && !(u.classIds || []).includes(c.id)) (u.classIds = u.classIds || []).push(c.id); }
    });
  });

  const gradeName = id => { const g = (structure.grades || []).find(x => x.id === id); return g ? g.name : ""; };
  (docs.students || []).forEach(s => {
    if (!s || !s.name) return;
    let L = byId(S.learners, s.id);
    if (!L) { S.learners.push({ id: s.id, name: s.name, ref: "", email: "", classId: s.classId, org: "", grade: gradeName(s.gradeId) }); nLearners++; }
    else { L.classId = s.classId || L.classId; if (!L.grade) L.grade = gradeName(s.gradeId); }
  });

  if (!S.attendance) S.attendance = {};
  Object.keys(docs).forEach(k => {
    if (k.indexOf("attendance:") !== 0) return;
    const parts = k.split(":"); if (parts.length < 3) return;
    const classId = parts[1], date = parts[2], v = docs[k] || {};
    S.attendance[attKey(classId, date)] = {
      presentIds: v.presentIds || [],
      takenBy: trainerId(v.teacher),
      takenByName: v.teacher || "",
      at: v.submittedAt || new Date().toISOString()
    };
    nRegisters++;
  });
  return { classes: nClasses, learners: nLearners, registers: nRegisters };
}

    case "editA": { const a = byId(S.assessments, id); if (!a || !ownsClass(a.classId)) { toast("You don't have access to that assessment"); break; } EDIT = JSON.parse(JSON.stringify(a)); if (a.status === "Completed" || a.status === "Reviewed") { if (!can("edit")) { go("assessments", { mode: "view", id }); toast("Submitted assessments are read-only"); break; } EDIT.status = "In Progress"; } go("assessments", { mode: "edit", id }); break; }
